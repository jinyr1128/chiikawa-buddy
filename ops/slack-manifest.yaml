# Slack 앱 매니페스트 — https://api.slack.com/apps → Create New App → From a manifest 에 붙여넣기
# Socket Mode라 공개 URL(Request URL)이 필요 없다. 맥에서 데몬이 돌면 바로 동작.
display_information:
  name: cy
  description: 내 PC에 상주하는 개인 비서 (브리핑 · 승인 · 자동 수정)
  background_color: "#3b2a5c"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: cy
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write        # DM으로 브리핑·제안·결과 보내기, 메시지 갱신
      - im:history        # 내가 봇 DM에 쓴 요청 읽기
      - im:read
      - im:write
      - reactions:write   # 요청 받으면 👀
      - canvases:write    # 봇 DM 캔버스에 할 일 목록 만들기·덮어쓰기·공유 (conversations.canvases.create, canvases.edit/create/access.set)
      - canvases:read     # 캔버스 섹션 조회 (canvases.sections.lookup)
settings:
  event_subscriptions:
    bot_events:
      - message.im
  interactivity:
    is_enabled: true      # 승인/보류/머지 버튼 (Socket Mode로 수신)
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
